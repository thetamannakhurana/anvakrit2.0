<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 2 Results - Anvakrit 2.0 | NFSU Delhi</title>
    <meta name="description" content="Round 2 Results - Top 21 Finalists for Anvakrit 2.0 National Crime Scene Investigation Competition">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #050810;
            --bg-darker: #02040a;
            --blue-dark: #0b1220;
            --blue-bright: #2563eb;
            --neon-blue: #00d4ff;
            --neon-cyan: #00eaff;
            --white: #ffffff;
            --white-dim: #e0e7ff;
            --gray: #8892b0;
            --gray-light: #a8b2d1;
            --shadow-blue: rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #0b1220 0%, #02040a 45%, #000000 100%);
            color: var(--white);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #binaryRainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.18;
            pointer-events: none;
        }

        /* FIREWORKS CANVAS */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 10, 25, 0.96);
            backdrop-filter: blur(14px);
            z-index: 10000;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(0, 212, 255, 0.18);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            gap: 2rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-logo-left {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 0 15px var(--shadow-blue));
        }

        .nav-title-link {
            text-decoration: none;
        }

        .nav-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 3px;
            text-shadow: 0 0 22px rgba(0, 212, 255, 0.9);
            margin: 0;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links li {
            margin: 0;
        }

        .nav-links a {
            display: inline-block;
            padding: 0.7rem 1.8rem;
            background: linear-gradient(135deg, var(--blue-bright) 0%, var(--neon-blue) 100%);
            color: var(--white);
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border-radius: 50px;
            border: 2px solid var(--neon-blue);
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 5px 18px rgba(0, 212, 255, 0.4);
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(0, 212, 255, 0.7);
        }

        /* RESULTS HERO */
        .results-hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10rem 2rem 4rem;
            position: relative;
            z-index: 2;
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
        }

        .results-hero-content {
            max-width: 900px;
        }

        .results-hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--white) 0%, var(--neon-blue) 45%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-subtitle {
            font-size: 1.5rem;
            color: var(--neon-cyan);
            margin-bottom: 2rem;
            font-weight: 700;
            animation: fadeIn 1s ease 0.3s backwards;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .clearance-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(0, 212, 255, 0.25));
            border: 2px solid var(--neon-blue);
            border-radius: 25px;
            padding: 1rem 2.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--white);
            animation: fadeIn 1s ease 0.6s backwards, badgePulse 2s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.45);
        }

        .clearance-badge span {
            color: var(--neon-cyan);
            font-weight: 900;
            font-size: 2rem;
        }

        @keyframes badgePulse {
            0%, 100% {
                box-shadow: 0 0 18px rgba(0, 212, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 34px rgba(0, 234, 255, 0.8);
            }
        }

        /* TEAMS SECTION */
        .teams-section {
            padding: 4rem 0 6rem;
            position: relative;
            z-index: 2;
        }

        .section-intro {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-intro h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
        }

        .section-intro p {
            font-size: 1.1rem;
            color: var(--white-dim);
            max-width: 700px;
            margin: 0 auto;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .team-card {
            background: rgba(10, 20, 40, 0.85);
            border: 1.5px solid rgba(0, 212, 255, 0.4);
            border-radius: 15px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.8);
        }

        .team-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(0, 212, 255, 0.12));
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .team-card.reveal {
            animation: revealTeam 0.6s ease forwards;
        }

        @keyframes revealTeam {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .team-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--neon-blue);
            box-shadow: 0 22px 60px rgba(0, 212, 255, 0.5);
        }

        .team-card:hover::after {
            opacity: 1;
        }

        .team-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--blue-bright), var(--neon-blue));
            color: var(--white);
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            box-shadow: 0 0 14px rgba(0, 212, 255, 0.6);
        }

        .team-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--neon-cyan);
            margin-bottom: 0.8rem;
        }

        .team-card p {
            color: var(--gray-light);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .team-status {
            display: inline-block;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan));
            color: var(--bg-black);
            font-weight: 900;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.7);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            nav {
                padding: 0.8rem 1rem;
            }

            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .logo-img {
                height: 50px;
            }

            .nav-title {
                font-size: 1.2rem;
            }

            .results-hero {
                padding: 8rem 1rem 3rem;
            }

            .results-hero h1 {
                font-size: 2.5rem;
            }

            .results-subtitle {
                font-size: 1.2rem;
            }

            .teams-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Binary Rain Canvas -->
    <canvas id="binaryRainCanvas"></canvas>
    
    <!-- Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="nav-brand">
                <div class="nav-logo-left">
                    <img src="images/anvakrit-logo.png" alt="Anvakrit Logo" class="logo-img">
                </div>
                <a href="home.html" class="nav-title-link">
                    <h1 class="nav-title">ANVAKRIT 2.0</h1>
                </a>
            </div>
            
            <ul class="nav-links">
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="results.html">📊 Round 1 Results</a></li>
            </ul>
        </div>
    </nav>

    <!-- Results Hero -->
    <section class="results-hero">
        <div class="results-hero-content">
            <h1>🏆 Round 2 Results 🏆</h1>
            <p class="results-subtitle">Congratulations to the TOP 21 FINALISTS!</p>
            <p class="clearance-badge">CLEARANCE LEVEL: <span>2</span></p>
        </div>
    </section>

    <!-- Teams Section -->
    <section class="teams-section">
        <div class="container">
            <div class="section-intro">
                <h2>🌐 Final 21 Teams 🌐</h2>
                <p>The following teams have successfully cleared Round 2 and advanced to the FINALS!</p>
            </div>

            <div class="teams-grid" id="teamsGrid">
                <!-- Teams will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <script>
    // Binary Rain Animation
    const canvas = document.getElementById('binaryRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const binary = '01';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawBinaryRain() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00d4ff';
        ctx.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
            const text = binary[Math.floor(Math.random() * binary.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(drawBinaryRain, 33);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
    });

    // FIREWORKS ANIMATION
    const fireworksCanvas = document.getElementById('fireworksCanvas');
    const fCtx = fireworksCanvas.getContext('2d');
    fireworksCanvas.width = window.innerWidth;
    fireworksCanvas.height = window.innerHeight;

    const fireworks = [];
    const particles = [];

    class Firework {
        constructor() {
            this.x = Math.random() * fireworksCanvas.width;
            this.y = fireworksCanvas.height;
            this.targetY = Math.random() * fireworksCanvas.height * 0.5;
            this.speed = Math.random() * 3 + 2;
            this.color = `hsl(${Math.random() * 60 + 190}, 100%, 60%)`;
        }

        update() {
            this.y -= this.speed;
            if (this.y <= this.targetY) {
                this.explode();
                return false;
            }
            return true;
        }

        draw() {
            fCtx.beginPath();
            fCtx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            fCtx.fillStyle = this.color;
            fCtx.fill();
        }

        explode() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(this.x, this.y, this.color));
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.velocity = {
                x: (Math.random() - 0.5) * 8,
                y: (Math.random() - 0.5) * 8
            };
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.015;
        }

        update() {
            this.velocity.y += 0.1;
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.alpha -= this.decay;
            return this.alpha > 0;
        }

        draw() {
            fCtx.save();
            fCtx.globalAlpha = this.alpha;
            fCtx.beginPath();
            fCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            fCtx.fillStyle = this.color;
            fCtx.fill();
            fCtx.restore();
        }
    }

    function animateFireworks() {
        fCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        fCtx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

        if (Math.random() < 0.05) {
            fireworks.push(new Firework());
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
            if (!fireworks[i].update()) {
                fireworks.splice(i, 1);
            } else {
                fireworks[i].draw();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            if (!particles[i].update()) {
                particles.splice(i, 1);
            } else {
                particles[i].draw();
            }
        }

        requestAnimationFrame(animateFireworks);
    }

    animateFireworks();

    // Stop fireworks after 15 seconds
    setTimeout(() => {
        fireworksCanvas.style.opacity = '0';
        fireworksCanvas.style.transition = 'opacity 2s ease';
        setTimeout(() => {
            fireworksCanvas.style.display = 'none';
        }, 2000);
    }, 15000);

    // Round 2 Qualified Teams
    const qualifiedTeamsRound2 = [
        { name: "Anveishq", institute: "National Forensic Sciences University, Gandhinagar" },
        { name: "Anviksha", institute: "National Forensic Sciences University, Chennai" },
        { name: "CIPHER SIRENS", institute: "National Forensic Sciences University, Dharwad, Karnataka" },
        { name: "CSI Overthinkers", institute: "Amity University" },
        { name: "ENIGMA BREAKERS", institute: "National Forensic Science University, Delhi" },
        { name: "Insight Innovators", institute: "National forensic science University chennai" },
        { name: "LOCARD'S HEIRS", institute: "National Forensics Sciences University (NFSU), Rohini, New Delhi" },
        { name: "Luminara", institute: "National Forensic Sciences University, Chennai" },
        { name: "Lux Veritas", institute: "National Forensic Science University, Delhi" },
        { name: "NECRO DETECTIVES", institute: "Narnarayan Shastri Institute of Technology - [NSIT], Ahmedabad" },
        { name: "NEXUS (Amity)", institute: "Amity University (AU), Noida" },
        { name: "NEXUS (NFSU)", institute: "National forensic science University chennai" },
        { name: "P.A.N.D.A", institute: "National Forensics Sciences University (NFSU), Rohini, New Delhi" },
        { name: "Proof beyond doubt", institute: "Amity University" },
        { name: "SATYANVESHI", institute: "National Forensic Sciences University, Gandhinagar" },
        { name: "TEAM CURIOUS", institute: "National Forensic Science University, Delhi" },
        { name: "Team Dhurandhar", institute: "OP Jindal Global University (OPJGU), Sonipat, Haryana" },
        { name: "Team SSU", institute: "Sri Sri University, Odisha" },
        { name: "The IFSM Investigators", institute: "Institute of Forensic Science, Mumbai" },
        { name: "The Scene Decoders", institute: "National Forensic Sciences University, Dharwad, Karnataka" },
        { name: "The whistleblowers", institute: "Narnarayan Shastri Institute of Technology - [NSIT], Ahmedabad" }
    ];

    const teamsGrid = document.getElementById('teamsGrid');
    
    qualifiedTeamsRound2.forEach((team, index) => {
        const teamCard = document.createElement('div');
        teamCard.className = 'team-card';
        
        teamCard.innerHTML = `
            <span class="team-number">#${index + 1}</span>
            <h3>${team.name}</h3>
            <p>${team.institute}</p>
            <span class="team-status">✓ FINALIST</span>
        `;
        
        teamsGrid.appendChild(teamCard);
    });

    // 3D Tilt Effect
    function apply3DTilt() {
        document.querySelectorAll('.team-card').forEach(card => {
            card.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;
                
                this.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px) scale(1.02)`;
                this.style.transition = 'none';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = '';
                this.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
        });
    }

    apply3DTilt();

    // Scroll-triggered animation
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const cards = document.querySelectorAll('.team-card:not(.reveal)');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('reveal');
                    }, index * 100);
                });
                
                observer.disconnect();
            }
        });
    }, {
        threshold: 0.05,
        rootMargin: '0px 0px -100px 0px'
    });

    observer.observe(document.querySelector('.teams-section'));
    </script>
</body>
</html>
